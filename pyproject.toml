[project]
name = "innovation-farming"
version = "0.2.0"
description = "Local, evidence-backed discovery of reusable GitHub projects."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "fastembed>=0.7,<1", "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
